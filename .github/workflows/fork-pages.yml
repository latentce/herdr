name: Fork Pages

# Publishes the fork's install script to GitHub Pages so new machines can use:
#   curl -fsSL https://latentce.github.io/herdr/install.sh | sh

on:
  push:
    branches: [fork]
    paths:
      - website/install.sh
      - .github/workflows/fork-pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp website/install.sh _site/install.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
